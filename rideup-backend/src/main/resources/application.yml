spring:
  application:
    name: rideup-backend
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rideup?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: false

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/rideup_chat}
      auto-index-creation: true
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB

server:
  port: 8080
  servlet:
    context-path: /api

app:
  upload:
    dir: ${UPLOAD_DIR:uploads/}

location:
  seeding:
    # Bật/tắt auto-seed lúc app khởi động
    enabled: ${LOCATION_SEED_ENABLED:true}
    # Số lần retry khi Overpass fail (timeout/5xx/429)
    max-retries: ${LOCATION_SEED_MAX_RETRIES:3}
    # Backoff ban đầu (ms) — sẽ nhân đôi sau mỗi retry, max 10s
    initial-backoff-ms: ${LOCATION_SEED_INITIAL_BACKOFF_MS:1500}
    # Delay giữa 2 tỉnh (ms) — tránh Overpass rate-limit
    delay-between-province-ms: ${LOCATION_SEED_DELAY_MS:2000}
    # Ngưỡng wards/tỉnh tối thiểu để coi là "đủ". DB wards < province × threshold
    # → auto re-seed wards (kể cả khi wardCount > 0)
    min-wards-per-province: ${LOCATION_SEED_MIN_WARDS_PER_PROVINCE:30}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.rideup: DEBUG
